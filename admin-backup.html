<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Torneos Purén</title>
</head>

<body>

    <h1>🔐 Administración</h1>

    <div id="login">
        <input
            type="email"
            id="email"
            placeholder="Correo"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button id="loginBtn">Iniciar sesión</button>

        <p id="loginMessage"></p>
    </div>

    <div id="adminPanel" style="display:none;">
        <h2>👑 Panel de administrador</h2>

        <p>Has iniciado sesión correctamente.</p>

        <button id="testBtn">Probar guardar equipo</button>
        <button id="logoutBtn">Cerrar sesión</button>

        <p id="adminMessage"></p>
    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL = "https://epaojsfeqsumboxvfrve.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pH9r9G9EFyq25BBlkRfM5w_pN72FTob";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


        // LOGIN
        document.getElementById("loginBtn").addEventListener("click", async () => {

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                console.error(error);

                document.getElementById("loginMessage").textContent =
                    "❌ " + error.message;

                return;
            }

            console.log("Usuario autenticado:", data.user);

            comprobarAdministrador();
        });


        // COMPROBAR ADMINISTRADOR
        async function comprobarAdministrador() {

            const { data: { user } } =
                await supabaseClient.auth.getUser();

            if (!user) {
                return;
            }

            if (user.id !== "e1be2be9-b96f-459e-9040-78d51455d3a9") {

                document.getElementById("loginMessage").textContent =
                    "❌ No tienes permisos de administrador.";

                await supabaseClient.auth.signOut();

                return;
            }

            document.getElementById("login").style.display = "none";
            document.getElementById("adminPanel").style.display = "block";

            console.log("👑 Administrador autenticado.");
        }


        // PRUEBA INSERT
        document.getElementById("testBtn").addEventListener("click", async () => {

            const { data, error } = await supabaseClient
                .from("equipos")
                .insert({
                    torneo_id: 4,
                    nombre: "Equipo Prueba Admin"
                })
                .select()
                .single();

            if (error) {

                console.error("Error:", error);

                document.getElementById("adminMessage").textContent =
                    "❌ Error: " + error.message;

                return;
            }

            console.log("Equipo creado:", data);

            document.getElementById("adminMessage").textContent =
                "✅ Equipo creado correctamente.";
        });


        // CERRAR SESIÓN
        document.getElementById("logoutBtn").addEventListener("click", async () => {

            await supabaseClient.auth.signOut();

            document.getElementById("adminPanel").style.display = "none";
            document.getElementById("login").style.display = "block";

            document.getElementById("adminMessage").textContent = "";
            document.getElementById("loginMessage").textContent = "";

        });

    </script>

</body>
</html>
