<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administración - Torneos Purén</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:1100px;
    margin:40px auto;
    padding:0 20px;
    background:#f5f7fb;
    color:#172033;
}

h1,h2,h3{
    margin-top:0;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input,select{
    padding:10px;
    margin:5px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    padding:10px 14px;
    margin:5px;
    border:0;
    border-radius:6px;
    cursor:pointer;
}

.primary{
    background:#246fe5;
    color:white;
}

.success{
    background:#198754;
    color:white;
}

.danger{
    background:#dc3545;
    color:white;
}

.secondary{
    background:#6c757d;
    color:white;
}

.equipo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding:10px 0;
}

.partido{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin-bottom:10px;
}

.marcador{
    width:60px;
}

.estado{
    font-size:14px;
    margin-left:10px;
}

.jugado{
    color:green;
}

.pendiente{
    color:#777;
}

#adminMessage,
#loginMessage{
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🔐 Administración</h1>

<!-- LOGIN -->
<div id="login" class="card">

    <h2>Iniciar sesión</h2>

    <input
        type="email"
        id="email"
        placeholder="Correo"
    >

    <input
        type="password"
        id="password"
        placeholder="Contraseña"
    >

    <button id="loginBtn" class="primary">
        Iniciar sesión
    </button>

    <p id="loginMessage"></p>

</div>


<!-- PANEL ADMINISTRADOR -->
<div id="adminPanel" style="display:none;">


    <!-- INFORMACIÓN TORNEO -->
    <div class="card">

        <h2>👑 Panel de administrador</h2>

        <p>
            Torneo actual:
            <strong id="nombreTorneoActual">Cargando...</strong>
        </p>

        <button id="logoutBtn" class="secondary">
            Cerrar sesión
        </button>

    </div>


    <!-- CONFIGURACIÓN -->
    <div class="card">

        <h2>⚙️ Configuración del torneo</h2>

        <input
            id="nombreTorneo"
            type="text"
            placeholder="Nombre del torneo"
        >

        <select id="modalidadTorneo">

            <option value="round1">
                Liga a una rueda
            </option>

            <option value="round2">
                Liga a dos ruedas
            </option>

        </select>

        <button
            id="guardarConfiguracionBtn"
            class="primary"
        >
            Guardar configuración
        </button>

    </div>


    <!-- EQUIPOS -->
    <div class="card">

        <h2>⚽ Equipos</h2>

        <input
            type="text"
            id="nombreEquipo"
            placeholder="Nombre del equipo"
        >

        <button
            id="agregarEquipoBtn"
            class="success"
        >
            + Agregar equipo
        </button>

        <div id="listaEquipos"></div>

    </div>


    <!-- FIXTURE -->
    <div class="card">

        <h2>📅 Fixture</h2>

        <p>
            Genera nuevamente todos los partidos utilizando
            los equipos actuales.
        </p>

        <button
            id="generarFixtureBtn"
            class="primary"
        >
            Generar / regenerar fixture
        </button>

    </div>


    <!-- RESULTADOS -->
    <div class="card">

        <h2>📝 Resultados</h2>

        <div id="listaPartidos"></div>

    </div>


    <p id="adminMessage"></p>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://epaojsfeqsumboxvfrve.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_pH9r9G9EFyq25BBlkRfM5w_pN72FTob";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const ADMIN_UID =
    "e1be2be9-b96f-459e-9040-78d51455d3a9";


let torneoActualId = null;
let torneoActual = null;

let equipos = [];
let partidos = [];



/* =========================================================
   LOGIN
========================================================= */

document
.getElementById("loginBtn")
.addEventListener("click", async () => {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });


    if(error){

        console.error(error);

        document.getElementById("loginMessage")
            .textContent =
            "❌ " + error.message;

        return;
    }


    console.log(
        "Usuario autenticado:",
        data.user
    );


    await comprobarAdministrador();

});



/* =========================================================
   COMPROBAR ADMINISTRADOR
========================================================= */

async function comprobarAdministrador(){

    const {
        data:{ user }
    } =
        await supabaseClient.auth.getUser();


    if(!user){
        return;
    }


    if(user.id !== ADMIN_UID){

        document.getElementById("loginMessage")
            .textContent =
            "❌ No tienes permisos de administrador.";

        await supabaseClient.auth.signOut();

        return;
    }


    document.getElementById("login")
        .style.display = "none";

    document.getElementById("adminPanel")
        .style.display = "block";


    await cargarTorneoActual();

}



/* =========================================================
   CARGAR TORNEO
========================================================= */

async function cargarTorneoActual(){

    const { data, error } =
        await supabaseClient
        .from("torneos")
        .select("*")
        .order("id", {
            ascending:false
        })
        .limit(1);


    if(error){

        console.error(
            "Error cargando torneo:",
            error
        );

        mensaje(
            "❌ No se pudo cargar el torneo."
        );

        return;
    }


    if(!data || data.length === 0){

        mensaje(
            "❌ No existe ningún torneo."
        );

        return;
    }


    torneoActual = data[0];

    torneoActualId =
        torneoActual.id;


    document.getElementById(
        "nombreTorneoActual"
    ).textContent =
        torneoActual.nombre;


    document.getElementById(
        "nombreTorneo"
    ).value =
        torneoActual.nombre || "";


    document.getElementById(
        "modalidadTorneo"
    ).value =
        torneoActual.modalidad || "round1";


    console.log(
        "Torneo administrativo:",
        torneoActual
    );


    await cargarEquipos();

    await cargarPartidos();

}



/* =========================================================
   CONFIGURACIÓN DEL TORNEO
========================================================= */

document
.getElementById("guardarConfiguracionBtn")
.addEventListener("click", async () => {

    const nombre =
        document
        .getElementById("nombreTorneo")
        .value
        .trim();


    const modalidad =
        document
        .getElementById("modalidadTorneo")
        .value;


    if(!nombre){

        mensaje(
            "❌ Escribe un nombre para el torneo."
        );

        return;
    }


    const { data, error } =
        await supabaseClient
        .from("torneos")
        .update({
            nombre,
            modalidad
        })
        .eq(
            "id",
            torneoActualId
        )
        .select()
        .single();


    if(error){

        console.error(
            "Error actualizando torneo:",
            error
        );

        mensaje(
            "❌ No se pudo actualizar el torneo."
        );

        return;
    }


    torneoActual = data;


    document.getElementById(
        "nombreTorneoActual"
    ).textContent =
        data.nombre;


    mensaje(
        "✅ Configuración guardada."
    );

});



/* =========================================================
   EQUIPOS
========================================================= */

async function cargarEquipos(){

    const { data, error } =
        await supabaseClient
        .from("equipos")
        .select("*")
        .eq(
            "torneo_id",
            torneoActualId
        )
        .order(
            "id",
            { ascending:true }
        );


    if(error){

        console.error(
            "Error cargando equipos:",
            error
        );

        return;
    }


    equipos =
        data || [];


    renderEquipos();

}



function renderEquipos(){

    const lista =
        document.getElementById(
            "listaEquipos"
        );


    if(equipos.length === 0){

        lista.innerHTML =
            "<p>No hay equipos registrados.</p>";

        return;
    }


    lista.innerHTML =
        equipos.map(equipo => `

            <div class="equipo">

                <span>
                    ${escapeHTML(equipo.nombre)}
                </span>

                <button
                    class="danger"
                    data-eliminar-equipo="${equipo.id}"
                >
                    Eliminar
                </button>

            </div>

        `).join("");


    document
    .querySelectorAll(
        "[data-eliminar-equipo]"
    )
    .forEach(btn => {

        btn.onclick =
            async () => {

                const id =
                    Number(
                        btn.dataset.eliminarEquipo
                    );

                await eliminarEquipo(id);

            };

    });

}



document
.getElementById("agregarEquipoBtn")
.addEventListener("click", async () => {

    const nombre =
        document
        .getElementById("nombreEquipo")
        .value
        .trim();


    if(!nombre){

        mensaje(
            "❌ Escribe el nombre del equipo."
        );

        return;
    }


    if(
        equipos.some(
            e =>
                e.nombre
                .toLowerCase() ===
                nombre.toLowerCase()
        )
    ){

        mensaje(
            "❌ Ese equipo ya existe."
        );

        return;
    }


    const { data, error } =
        await supabaseClient
        .from("equipos")
        .insert({
            torneo_id:
                torneoActualId,

            nombre:
                nombre
        })
        .select()
        .single();


    if(error){

        console.error(
            "Error guardando equipo:",
            error
        );

        mensaje(
            "❌ Error: " +
            error.message
        );

        return;
    }


    equipos.push(data);


    document
    .getElementById("nombreEquipo")
    .value = "";


    renderEquipos();


    mensaje(
        "✅ Equipo creado correctamente."
    );

});



async function eliminarEquipo(equipoId){

    const equipo =
        equipos.find(
            e => e.id === equipoId
        );


    if(!equipo){
        return;
    }


    if(
        !confirm(
            `¿Eliminar el equipo "${equipo.nombre}"?\n\nTambién se eliminarán sus partidos.`
        )
    ){
        return;
    }


    /*
       Primero partidos donde es local
    */

    let { error } =
        await supabaseClient
        .from("partidos")
        .delete()
        .eq(
            "equipo_local_id",
            equipoId
        );


    if(error){

        console.error(error);

        mensaje(
            "❌ No se pudieron eliminar los partidos."
        );

        return;
    }


    /*
       Después donde es visitante
    */

    ({ error } =
        await supabaseClient
        .from("partidos")
        .delete()
        .eq(
            "equipo_visitante_id",
            equipoId
        ));


    if(error){

        console.error(error);

        mensaje(
            "❌ No se pudieron eliminar los partidos."
        );

        return;
    }


    /*
       Finalmente equipo
    */

    ({ error } =
        await supabaseClient
        .from("equipos")
        .delete()
        .eq(
            "id",
            equipoId
        ));


    if(error){

        console.error(error);

        mensaje(
            "❌ No se pudo eliminar el equipo."
        );

        return;
    }


    equipos =
        equipos.filter(
            e =>
                e.id !== equipoId
        );


    partidos =
        partidos.filter(
            p =>
                p.equipo_local_id
                    !== equipoId
                &&
                p.equipo_visitante_id
                    !== equipoId
        );


    renderEquipos();

    renderPartidos();


    mensaje(
        "✅ Equipo eliminado."
    );

}



/* =========================================================
   FIXTURE
========================================================= */

document
.getElementById("generarFixtureBtn")
.addEventListener("click", async () => {

    if(equipos.length < 2){

        mensaje(
            "❌ Necesitas al menos 2 equipos."
        );

        return;
    }


    if(partidos.length > 0){

        const continuar =
            confirm(
                "Ya existen partidos.\n\n" +
                "Si regeneras el fixture se eliminarán " +
                "los partidos y resultados actuales.\n\n" +
                "¿Continuar?"
            );


        if(!continuar){
            return;
        }

    }


    /*
       Eliminamos el fixture anterior
    */

    const { error: deleteError } =
        await supabaseClient
        .from("partidos")
        .delete()
        .eq(
            "torneo_id",
            torneoActualId
        );


    if(deleteError){

        console.error(
            deleteError
        );

        mensaje(
            "❌ No se pudo eliminar el fixture anterior."
        );

        return;
    }


    const modalidad =
        document
        .getElementById(
            "modalidadTorneo"
        )
        .value;


    const nuevosPartidos = [];


    for(
        let i = 0;
        i < equipos.length;
        i++
    ){

        for(
            let j = i + 1;
            j < equipos.length;
            j++
        ){

            nuevosPartidos.push({

                torneo_id:
                    torneoActualId,

                jornada:
                    1,

                equipo_local_id:
                    equipos[i].id,

                equipo_visitante_id:
                    equipos[j].id,

                goles_local:
                    null,

                goles_visitante:
                    null,

                estado:
                    "pendiente"

            });


            if(
                modalidad === "round2"
            ){

                nuevosPartidos.push({

                    torneo_id:
                        torneoActualId,

                    jornada:
                        2,

                    equipo_local_id:
                        equipos[j].id,

                    equipo_visitante_id:
                        equipos[i].id,

                    goles_local:
                        null,

                    goles_visitante:
                        null,

                    estado:
                        "pendiente"

                });

            }

        }

    }


    const { data, error } =
        await supabaseClient
        .from("partidos")
        .insert(
            nuevosPartidos
        )
        .select();


    if(error){

        console.error(
            "Error generando fixture:",
            error
        );

        mensaje(
            "❌ No se pudo generar el fixture."
        );

        return;
    }


    partidos =
        data || [];


    renderPartidos();


    mensaje(
        `✅ Fixture generado: ${partidos.length} partidos.`
    );

});



/* =========================================================
   PARTIDOS
========================================================= */

async function cargarPartidos(){

    const { data, error } =
        await supabaseClient
        .from("partidos")
        .select("*")
        .eq(
            "torneo_id",
            torneoActualId
        )
        .order(
            "id",
            { ascending:true }
        );


    if(error){

        console.error(
            "Error cargando partidos:",
            error
        );

        return;
    }


    partidos =
        data || [];


    renderPartidos();

}



function nombreEquipo(id){

    const equipo =
        equipos.find(
            e => e.id === id
        );


    return equipo
        ? equipo.nombre
        : "Equipo desconocido";

}



function renderPartidos(){

    const lista =
        document.getElementById(
            "listaPartidos"
        );


    if(partidos.length === 0){

        lista.innerHTML =
            "<p>No hay partidos generados.</p>";

        return;
    }


    lista.innerHTML =
        partidos.map(partido => {

            const jugado =
                partido.estado === "jugado";


            return `

            <div class="partido">

                <strong>
                    ${escapeHTML(
                        nombreEquipo(
                            partido.equipo_local_id
                        )
                    )}
                </strong>

                <input
                    class="marcador"
                    type="number"
                    min="0"
                    data-goles-local="${partido.id}"
                    value="${partido.goles_local ?? ""}"
                >

                -

                <input
                    class="marcador"
                    type="number"
                    min="0"
                    data-goles-visitante="${partido.id}"
                    value="${partido.goles_visitante ?? ""}"
                >

                <strong>
                    ${escapeHTML(
                        nombreEquipo(
                            partido.equipo_visitante_id
                        )
                    )}
                </strong>


                <span class="estado ${jugado ? "jugado" : "pendiente"}">

                    ${jugado
                        ? "✓ Jugado"
                        : "Pendiente"}

                </span>


                <br><br>


                <button
                    class="success"
                    data-guardar-resultado="${partido.id}"
                >
                    Guardar resultado
                </button>


                <button
                    class="danger"
                    data-limpiar-resultado="${partido.id}"
                >
                    Limpiar
                </button>

            </div>

            `;

        }).join("");


    /*
       Guardar resultados
    */

    document
    .querySelectorAll(
        "[data-guardar-resultado]"
    )
    .forEach(btn => {

        btn.onclick =
            async () => {

                const partidoId =
                    Number(
                        btn.dataset.guardarResultado
                    );


                await guardarResultado(
                    partidoId
                );

            };

    });


    /*
       Limpiar resultados
    */

    document
    .querySelectorAll(
        "[data-limpiar-resultado]"
    )
    .forEach(btn => {

        btn.onclick =
            async () => {

                const partidoId =
                    Number(
                        btn.dataset.limpiarResultado
                    );


                await limpiarResultado(
                    partidoId
                );

            };

    });

}



/* =========================================================
   GUARDAR RESULTADO
========================================================= */

async function guardarResultado(partidoId){

    const inputLocal =
        document.querySelector(
            `[data-goles-local="${partidoId}"]`
        );


    const inputVisitante =
        document.querySelector(
            `[data-goles-visitante="${partidoId}"]`
        );


    if(
        inputLocal.value === ""
        ||
        inputVisitante.value === ""
    ){

        mensaje(
            "❌ Ingresa ambos marcadores."
        );

        return;
    }


    const golesLocal =
        Number(inputLocal.value);

    const golesVisitante =
        Number(inputVisitante.value);


    if(
        !Number.isInteger(golesLocal)
        ||
        !Number.isInteger(golesVisitante)
        ||
        golesLocal < 0
        ||
        golesVisitante < 0
    ){

        mensaje(
            "❌ Los goles deben ser números enteros iguales o mayores que 0."
        );

        return;
    }


    const { data, error } =
        await supabaseClient
        .from("partidos")
        .update({

            goles_local:
                golesLocal,

            goles_visitante:
                golesVisitante,

            estado:
                "jugado"

        })
        .eq(
            "id",
            partidoId
        )
        .select()
        .single();


    if(error){

        console.error(
            "Error actualizando resultado:",
            error
        );

        mensaje(
            "❌ No se pudo guardar el resultado."
        );

        return;
    }


    const indice =
        partidos.findIndex(
            p =>
                p.id === partidoId
        );


    if(indice !== -1){

        partidos[indice] =
            data;

    }


    renderPartidos();


    mensaje(
        "✅ Resultado guardado."
    );

}



/* =========================================================
   LIMPIAR RESULTADO
========================================================= */

async function limpiarResultado(partidoId){

    const partido =
        partidos.find(
            p =>
                p.id === partidoId
        );


    if(!partido){
        return;
    }


    if(
        partido.estado === "jugado"
        &&
        !confirm(
            "¿Eliminar el resultado de este partido?"
        )
    ){
        return;
    }


    const { data, error } =
        await supabaseClient
        .from("partidos")
        .update({

            goles_local:
                null,

            goles_visitante:
                null,

            estado:
                "pendiente"

        })
        .eq(
            "id",
            partidoId
        )
        .select()
        .single();


    if(error){

        console.error(
            "Error limpiando resultado:",
            error
        );

        mensaje(
            "❌ No se pudo limpiar el resultado."
        );

        return;
    }


    const indice =
        partidos.findIndex(
            p =>
                p.id === partidoId
        );


    if(indice !== -1){

        partidos[indice] =
            data;

    }


    renderPartidos();


    mensaje(
        "✅ Resultado eliminado."
    );

}



/* =========================================================
   UTILIDADES
========================================================= */

function mensaje(texto){

    document
    .getElementById(
        "adminMessage"
    )
    .textContent =
        texto;

}



function escapeHTML(texto){

    return String(texto)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}



/* =========================================================
   CERRAR SESIÓN
========================================================= */

document
.getElementById("logoutBtn")
.addEventListener("click", async () => {

    await supabaseClient
        .auth
        .signOut();


    torneoActualId = null;

    torneoActual = null;

    equipos = [];

    partidos = [];


    document.getElementById(
        "adminPanel"
    ).style.display =
        "none";


    document.getElementById(
        "login"
    ).style.display =
        "block";


    document.getElementById(
        "adminMessage"
    ).textContent =
        "";


    document.getElementById(
        "loginMessage"
    ).textContent =
        "";

});



/* =========================================================
   SI YA EXISTE SESIÓN
========================================================= */

comprobarAdministrador();

</script>

</body>
</html>
